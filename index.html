<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"><meta name="theme-color" content="#edf5f0"><meta name="description" content="Premier League scores and your accumulators, connected."><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="stylesheet" href="style.css"><title>Goalline</title></head><body><div id="app"><header><div class="top"><h1>GOALLINE<span></span></h1><div class="tools"><button data-action="filter" aria-label="Filter">⌕</button><button data-action="sort" aria-label="Change sort order">⇅</button><button data-action="compact" aria-label="Toggle compact cards">≡</button><button data-action="refresh" aria-label="Refresh scores" id="refresh">↻</button></div></div><div class="sub"><span>PREMIER LEAGUE</span><span id="sync" role="status">Connecting…</span></div><div class="datebar"><button data-action="prev" aria-label="Previous day">‹</button><input type="date" id="date" aria-label="Fixture date"><button data-action="next" aria-label="Next day">›</button><button data-action="today">Today</button></div><div id="filters" hidden><select id="filter" aria-label="Filter matches and feed"><option value="all">All games</option><option value="in">Live games</option><option value="mine">My games</option><option value="pre">Upcoming</option><option value="post">Finished</option></select><select id="betfilter" aria-label="Filter bets"><option value="all">All bets</option><option value="active">Active bets</option><option value="settled">Settled bets</option></select><button data-action="export">Back up bets</button><label class="import">Restore<input type="file" id="import" accept="application/json" hidden></label></div><div id="warning" role="status" hidden></div></header><main id="content" aria-label="Games"></main><footer><button class="slipbar" data-action="slip"><span class="slipicon">▱</span><span id="sliplabel">Bet slip · 0</span><span class="push">⌃</span></button><nav aria-label="Main pages"><button data-page="games" class="active"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 12h16M9 3v4h6V3M9 21v-4h6v4"/><circle cx="12" cy="12" r="3"/></svg>Games</button><button data-page="bets"><svg viewBox="0 0 24 24"><path d="m8 3 12 2-3 17-12-2zM5 5H2v14h3M9 9l6 1M8 14l6 1"/></svg>Bets</button><button data-page="live"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2"/><path d="M7 7a7 7 0 0 0 0 10M17 7a7 7 0 0 1 0 10M4 4a11 11 0 0 0 0 16M20 4a11 11 0 0 1 0 16"/></svg>Live</button></nav></footer></div><dialog id="sheet"><div class="handle" id="handle"><span></span></div><div class="sheethead"><h2>Bet slip <small id="legcount"></small></h2><button data-action="close" aria-label="Close betslip">×</button></div><form id="betform"><div id="sliplegs"></div><label>Accumulator name<input id="betname" maxlength="80" placeholder="Automatically named from your picks"></label><div class="formrow"><label>Stake (£)<input id="stake" type="number" inputmode="decimal" min="0.01" max="1000000" step="0.01" required></label><label>Total decimal odds<input id="odds" type="number" inputmode="decimal" min="1.01" max="1000000" step="0.01" required></label></div><div class="return"><span>Potential return</span><strong id="return">£0.00</strong></div><p class="fine">90 minutes + stoppage time. Track an existing bet; no bet is placed here.</p><button class="primary" type="submit">Track bet</button><p id="formerror" role="alert"></p></form></dialog><dialog id="popup"><div class="sheethead"><h2>Linked bets</h2><button data-action="popupclose" aria-label="Close linked bets">×</button></div><div id="popupbody"></div></dialog><div id="toast" role="status"></div><script type="module" src="app.js"></script></body></html>
